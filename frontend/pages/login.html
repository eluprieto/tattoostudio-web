<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar | TattooStudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <a href="../index.html" aria-label="Volver al inicio">
          <svg viewBox="0 0 160 50" xmlns="http://www.w3.org/2000/svg" style="width:140px;height:44px">
            <text x="0" y="36" class="logo-text-main">TATTOO</text>
            <text x="2" y="48" class="logo-text-sub">STUDIO</text>
          </svg>
        </a>
      </div>

      <h1 class="auth-title">Bienvenido de vuelta</h1>
      <p class="auth-subtitle">Ingresá con tu cuenta para continuar.</p>

      <!-- Error global -->
      <p class="error-message" id="login-error" role="alert"></p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <div class="password-toggle">
            <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div class="checkbox-group" style="margin-bottom:.5rem">
          <input type="checkbox" id="remember-me" name="remember" />
          <label for="remember-me">Recordarme</label>
        </div>

        <a href="forgot-password.html" class="link-gold" style="font-size:.82rem;display:block;text-align:right;margin-bottom:1.25rem">
          ¿Olvidaste tu contraseña?
        </a>

        <button type="submit" class="btn-gold btn-full">Ingresar</button>
      </form>

      <div class="auth-divider"><span>o</span></div>

      <a href="https://wa.me/5491100000000?text=Hola,%20necesito%20ayuda%20con%20mi%20cuenta"
         target="_blank" rel="noopener"
         class="btn-outline-gold btn-full" style="justify-content:center">
        Contactar por WhatsApp
      </a>

      <p class="auth-switch">
        ¿No tenés cuenta? <a href="register.html">Registrate gratis</a>
      </p>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
