<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse | TattooStudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <a href="../index.html" aria-label="Volver al inicio">
          <svg viewBox="0 0 160 50" xmlns="http://www.w3.org/2000/svg" style="width:140px;height:44px">
            <text x="0" y="36" class="logo-text-main">TATTOO</text>
            <text x="2" y="48" class="logo-text-sub">STUDIO</text>
          </svg>
        </a>
      </div>

      <h1 class="auth-title">Crear cuenta</h1>
      <p class="auth-subtitle">Registrate para ver tus pedidos y guardar tu dirección.</p>

      <p class="error-message" id="register-error" role="alert"></p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-name">Nombre completo</label>
          <input type="text" id="reg-name" name="name" placeholder="Tu nombre" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <div class="password-toggle">
            <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password2">Repetir contraseña</label>
          <div class="password-toggle">
            <input type="password" id="reg-password2" name="password2" placeholder="Repetí tu contraseña" required autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="reg-newsletter" name="acceptsOffers" />
          <label for="reg-newsletter">Quiero recibir ofertas y novedades del estudio por email.</label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="reg-terms" name="terms" required />
          <label for="reg-terms">Acepto los <a href="#" class="link-gold">términos y condiciones</a> y la <a href="#" class="link-gold">política de privacidad</a>.</label>
        </div>

        <button type="submit" class="btn-gold btn-full">Crear cuenta</button>
      </form>

      <p class="auth-switch">
        ¿Ya tenés cuenta? <a href="login.html">Ingresá aquí</a>
      </p>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
